name: Build & Release MECHSTUDY OS for Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Desktop App & Release
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'MECHSTUDY-OS/package-lock.json'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Tools
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Install Node Dependencies
        working-directory: ./MECHSTUDY-OS
        run: npm ci

      - name: Ensure Application Icons Exist
        working-directory: ./MECHSTUDY-OS
        run: python tools/generate_icon.py

      - name: Run TypeScript Type Check
        working-directory: ./MECHSTUDY-OS
        run: npm run typecheck

      - name: Run Unit Tests
        working-directory: ./MECHSTUDY-OS
        run: npm test

      - name: Run Integration Tests
        working-directory: ./MECHSTUDY-OS
        run: npm run test:integration

      - name: Package Windows Installer & Portable Exe
        working-directory: ./MECHSTUDY-OS
        run: npm run package

      - name: Compute SHA-256 Checksums
        working-directory: ./MECHSTUDY-OS
        shell: powershell
        run: |
          Get-ChildItem -Path release -Filter "*.exe" | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)"
          } | Out-File -Encoding utf8 release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            MECHSTUDY-OS/release/MECHSTUDY-OS-Setup-*.exe
            MECHSTUDY-OS/release/MECHSTUDY-OS-Portable-*.exe
            MECHSTUDY-OS/release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
