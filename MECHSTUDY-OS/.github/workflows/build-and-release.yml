name: Build & Release MECHSTUDY OS (Windows & Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop App
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'MECHSTUDY-OS/package-lock.json'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Tools
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Install Node Dependencies
        working-directory: ./MECHSTUDY-OS
        run: npm ci

      - name: Ensure Application Icons Exist
        working-directory: ./MECHSTUDY-OS
        run: python tools/generate_icon.py

      - name: Run TypeScript Type Check
        working-directory: ./MECHSTUDY-OS
        run: npm run typecheck

      - name: Run Unit Tests
        working-directory: ./MECHSTUDY-OS
        run: npm test

      - name: Run Integration Tests
        working-directory: ./MECHSTUDY-OS
        run: npm run test:integration

      - name: Package Windows Installer & Portable Exe
        working-directory: ./MECHSTUDY-OS
        run: npm run package

      - name: Compute Windows SHA-256 Checksums
        working-directory: ./MECHSTUDY-OS
        shell: powershell
        run: |
          Get-ChildItem -Path release -Filter "*.exe" | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)"
          } | Out-File -Encoding utf8 release/SHA256SUMS-win.txt
          Get-Content release/SHA256SUMS-win.txt

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            MECHSTUDY-OS/release/MECHSTUDY-OS-Setup-*.exe
            MECHSTUDY-OS/release/MECHSTUDY-OS-Portable-*.exe
            MECHSTUDY-OS/release/SHA256SUMS-win.txt
          if-no-files-found: error

  build-linux:
    name: Build Linux Desktop App (AppImage & deb)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'MECHSTUDY-OS/package-lock.json'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools fakeroot dpkg

      - name: Install Python Tools
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Install Node Dependencies
        working-directory: ./MECHSTUDY-OS
        run: npm ci

      - name: Ensure Application Icons Exist
        working-directory: ./MECHSTUDY-OS
        run: python tools/generate_icon.py

      - name: Run TypeScript Type Check
        working-directory: ./MECHSTUDY-OS
        run: npm run typecheck

      - name: Run Unit Tests
        working-directory: ./MECHSTUDY-OS
        run: npm test

      - name: Run Integration Tests
        working-directory: ./MECHSTUDY-OS
        run: npm run test:integration

      - name: Package Linux AppImage & deb
        working-directory: ./MECHSTUDY-OS
        run: npm run package:linux

      - name: Compute Linux SHA-256 Checksums
        working-directory: ./MECHSTUDY-OS
        run: |
          cd release
          sha256sum MECHSTUDY-OS-*.AppImage MECHSTUDY-OS-*.deb > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            MECHSTUDY-OS/release/MECHSTUDY-OS-*.AppImage
            MECHSTUDY-OS/release/MECHSTUDY-OS-*.deb
            MECHSTUDY-OS/release/SHA256SUMS-linux.txt
          if-no-files-found: error

  publish-release:
    name: Publish Multi-Platform Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: artifacts/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: artifacts/

      - name: Combine SHA-256 Checksums
        working-directory: artifacts
        run: |
          cat SHA256SUMS-win.txt SHA256SUMS-linux.txt > SHA256SUMS.txt
          rm -f SHA256SUMS-win.txt SHA256SUMS-linux.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
